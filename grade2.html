<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grade Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0 auto;
      max-width: 750px;
      background-color: #B5D7C9;
      padding: 20px;
      padding-top: 100px;
    }

    h2 {
      text-align: center;
      margin-bottom: 40px;
      color: #333;
    }

    .section {
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .section h3 {
      margin-top: 0;
      color: #0057a4;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }

    .slider-block {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input[type="range"] {
      width: 100%;
    }

    .output {
      font-size: 1.4em;
      font-weight: bold;
      margin-top: 30px;
      text-align: center;
      color: #222;
    }
  </style>
</head>
<body>
  <h2>Final Grade Calculator</h2>

  <div class="section">
    <h3>📝 Midterms (45% total — 15% each)</h3>
    <div class="slider-block">
      <label>Midterm 1 (15%)</label>
      <input type="range" id="midterm1" min="0" max="100" value="80">
      <span id="val_midterm1">80</span>
    </div>
    <div class="slider-block">
      <label>Midterm 2 (15%)</label>
      <input type="range" id="midterm2" min="0" max="100" value="80">
      <span id="val_midterm2">80</span>
    </div>
    <div class="slider-block">
      <label>Midterm 3 (15%)</label>
      <input type="range" id="midterm3" min="0" max="100" value="80">
      <span id="val_midterm3">80</span>
    </div>
  </div>

  <div class="section">
    <h3>🎓 Final Exam (40%)</h3>
    <div class="slider-block">
      <label>Final Exam (40%)</label>
      <input type="range" id="finalExam" min="0" max="100" value="80">
      <span id="val_finalExam">80</span>
    </div>
  </div>

  <div class="section">
    <h3>📚 Homework (5%)</h3>
    <div class="slider-block">
      <label>Homework (5%)</label>
      <input type="range" id="homework" min="0" max="100" value="90">
      <span id="val_homework">90</span>
    </div>
  </div>

  <div class="section">
    <h3>📊 Quizzes (10%)</h3>
    <div class="slider-block">
      <label>Quiz 1</label>
      <input type="range" id="quiz1" min="0" max="100" value="90">
      <span id="val_quiz1">90</span>
    </div>
    <div class="slider-block">
      <label>Quiz 2</label>
      <input type="range" id="quiz2" min="0" max="100" value="90">
      <span id="val_quiz2">90</span>
    </div>
    <div class="slider-block">
      <label>Quiz 3</label>
      <input type="range" id="quiz3" min="0" max="100" value="90">
      <span id="val_quiz3">90</span>
    </div>
    <div class="slider-block">
      <label>Quiz 4</label>
      <input type="range" id="quiz4" min="0" max="100" value="90">
      <span id="val_quiz4">90</span>
    </div>
    <div class="slider-block">
      <label>Quiz 5</label>
      <input type="range" id="quiz5" min="0" max="100" value="90">
      <span id="val_quiz5">90</span>
    </div>
  </div>

  <div class="section">
    <h3>📈 Final Grade</h3>
    <div class="output" id="result">Final Score: -- | Letter Grade: --</div>
  </div>

  <script>
  const sliders = [
    "midterm1", "midterm2", "midterm3", "finalExam", "homework",
    "quiz1", "quiz2", "quiz3", "quiz4", "quiz5"
  ];

  function update() {
    sliders.forEach(id => {
      const slider = document.getElementById(id);
      document.getElementById("val_" + id).textContent = slider.value;
    });

    const m1 = parseFloat(document.getElementById("midterm1").value);
    const m2 = parseFloat(document.getElementById("midterm2").value);
    const m3 = parseFloat(document.getElementById("midterm3").value);
    const final = parseFloat(document.getElementById("finalExam").value);
    const hw = parseFloat(document.getElementById("homework").value);
    const quizzes = ["quiz1", "quiz2", "quiz3", "quiz4", "quiz5"].map(id =>
      parseFloat(document.getElementById(id).value)
    );

    const quizAverage = quizzes.reduce((a, b) => a + b, 0) / quizzes.length;

    const total =
      0.15 * m1 +
      0.15 * m2 +
      0.15 * m3 +
      0.40 * final +
      0.05 * hw +
      0.10 * quizAverage;

    let letter = "F";
    if (total >= 93) letter = "A/A+";
    else if (total >= 90) letter = "A-";
    else if (total >= 87) letter = "B+";
    else if (total >= 83) letter = "B";
    else if (total >= 80) letter = "B-";
    else if (total >= 77) letter = "C+";
    else if (total >= 73) letter = "C";
    else if (total >= 70) letter = "C-";
    else if (total >= 60) letter = "D";

    document.getElementById("result").textContent =
      "Final Score: " + total.toFixed(2) + " | Letter Grade: " + letter;
  }

  sliders.forEach(id => {
    document.getElementById(id).addEventListener("input", update);
  });

  update();
  </script>

</body>
</html>
